[package]
name = "muxxy"
version = "0.3.0"
edition = "2024"
description = "Interact with a REPL running inside a tmux pane, from the command line"
license = "MIT"
repository = "https://github.com/djha-skin/muxxy"
readme = "README.md"
keywords = ["tmux", "repl", "cli", "terminal", "automation"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde_json = "1"
tmux_interface = "0.4"

[dev-dependencies]
serde_yaml = "0.9"
