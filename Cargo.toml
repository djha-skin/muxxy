[package]
name = "muxxy"
version = "0.1.0"
edition = "2024"
description = "Interact with a REPL running inside a tmux pane, from the command line"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tmux_interface = "0.4"
