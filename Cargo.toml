[package]
name = "muxxy"
version = "0.2.0"
edition = "2024"
description = "Interact with a REPL running inside a tmux pane, from the command line"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde_json = "1"
tmux_interface = "0.4"

[dev-dependencies]
serde_yaml = "0.9"
